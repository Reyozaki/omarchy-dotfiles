# Application bindings

bindd = CTRL, Q, Close active window, killactive
bindd = SUPER, return, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" tmux new
bindd = SUPER, E, File manager, exec, uwsm app -- nautilus --new-window
bindd = SUPER, B, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER, N, Editor, exec, omarchy-launch-editor
bindd = SUPER, D, Discord, exec, uwsm app -- discord

bindd = SUPER SHIFT, T, Activity, exec, omarchy-launch-tui btop
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker 
bindd = SUPER SHIFT, O, OBS Studio, exec, uwsm app -- obs


# If your web app url contains #, type it as ## to prevent hyperland treat it as comments

# Super + {Letter}, fast quick access webapps
bindd = SUPER, A, Claude AI, exec, omarchy-launch-webapp "https://claude.ai/"
bindd = SUPER, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER, M, Spotify, exec, omarchy-launch-webapp "https://open.spotify.com/"

# Super + Shift + {letter}, alternative or less common webapps
bindd = SUPER SHIFT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
bindd = SUPER SHIFT, C, Calendar, exec, omarchy-launch-webapp "https://calendar.google.com/calendar/u/0/r/"

# Super + Alt + {letter}, common webapps
bindd = SUPER ALT, M, Gmail, exec, omarchy-launch-webapp "https://mail.google.com/mail/u/0/##inbox"
bindd = SUPER ALT, W, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindd = SUPER ALT, A, Gemini, exec, omarchy-launch-webapp "https://gemini.google.com/"
bindd = SUPER ALT, H, GitHub, exec, omarchy-launch-webapp "https://github.com/"
bindd = SUPER ALT, C, CStimer, exec, omarchy-launch-webapp "https://www.cstimer.net"
bindd = SUPER ALT, N, Notion, exec, omarchy-launch-webapp "https://www.notion.so"

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu

# default unbinds
unbind = SUPER, W # kill active new-window
unbind = SUPER, O # toggle window float
unbind = SUPER CTRL, T
unbind = SUPER CTRL ALT, B
unbind = SUPER, L
unbind = Super ALT, B

# binding changes
bindd = SUPER, O, Obsidian, exec, uwsm app -- obsidian
# bindd = SUPER ALT, B, Show battery remaining, exec, notify-send "󰁹    Battery is at $(omarchy-battery-remaining)%"
bindd = SUPER ALT, B, Zen, exec, uwsm-app -- zen-browser
bindd = SUPER CTRL, P, Pop window out (float & pin), exec, omarchy-hyprland-window-pop
bindd = SUPER, L, LocalSend, exec, uwsm app -- localsend
bindd = SUPER CTRL, T,Toggle workspace layout, exec, omarchy-hyprland-workspace-layout-toggle
