# create config refresh keybind — Leader, r
unbind r
bind r source-file '~/.config/tmux/tmux.conf'

# setting leader to CTRL+s instead of CTRL+b
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# allow mouse activity like resizing panes and scrolling
set -g mouse on

# use vim-key for navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Status-bar configurations
set-option -g status-position top  # position — default = bottom
set -g status-right-length 100
set -g status-left-length 100


# Catppuccin configurations ⬇

# Load catppuucin
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

set -g @catppuccin_flavor 'mocha'  # catppuccin theme (latte, frappe, macchiato, mocha)
set -g @catppuccin_window_status_style 'rounded'
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"


# TMUX Pluggins Manager ⬇

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
run '~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux'
run '~/.config/tmux/plugins/tmux-plugins/tmux-cpu/cpu.tmux'
run '~/.config/tmux/plugins/tmux-plugins/tmux-battery/battery.tmux'
